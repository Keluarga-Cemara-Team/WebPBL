name: WebPBL PMPL CI Tests

on:
  push:
    branches: [ main, master, develop, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test-webpbl:
    name: WebPBL PMPL Test Cases (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax (compileall)
        run: python -m compileall -q app run.py tests

      - name: Run WebPBL PMPL Test Suite (TS-DET, TS-KLA, TS-REK, TS-HAS, TS-PERF)
        env:
          FLASK_ENV: development
        run: pytest -v tests/
